<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async function () {
    // 1. Determine theme (al-folio stores theme in data-theme on <html>)
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";

    mermaid.initialize({
      startOnLoad: false,
      theme: isDark ? "dark" : "default",
      securityLevel: "loose"
    });

    // 2. Query code elements generated by Rouge/Kramdown
    // Catches .language-mermaid on either <div>, <pre>, or <code>
    let targets = document.querySelectorAll(
      "div.language-mermaid, pre.language-mermaid, code.language-mermaid, pre > code"
    );

    let foundBlocks = [];

    targets.forEach((el) => {
      // If el is the code element, use it; otherwise find inner code tag
      const codeEl = el.tagName.toLowerCase() === "code" ? el : el.querySelector("code");
      if (!codeEl) return;

      const content = codeEl.textContent.trim();
      
      // Verify if the block has mermaid language tag or starts with mermaid grammar
      const isMermaid = 
        el.classList.contains("language-mermaid") ||
        codeEl.classList.contains("language-mermaid") ||
        /^(flowchart|graph|sequenceDiagram|stateDiagram|classDiagram|erDiagram|gantt|pie|gitGraph)\b/.test(content);

      if (isMermaid) {
        // Find the outermost highlighter container created by Rouge
        const rootContainer = el.closest(".highlighter-rouge") || el.closest("pre") || el;
        
        // Prevent duplicate processing
        if (rootContainer.dataset.mermaidProcessed) return;
        rootContainer.dataset.mermaidProcessed = "true";

        const div = document.createElement("div");
        div.className = "mermaid text-center";
        div.textContent = content;

        rootContainer.parentNode.replaceChild(div, rootContainer);
        foundBlocks.push(div);
      }
    });

    console.log(`[Mermaid] Found and converted ${foundBlocks.length} diagrams.`);

    // 3. Render all generated containers
    if (foundBlocks.length > 0) {
      await mermaid.run({
        nodes: foundBlocks
      });
    }
  });
</script>
